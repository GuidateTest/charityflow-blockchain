<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <style>
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .vuln { fill: #3d1f1f; stroke: #f85149; }
      .secure { fill: #1f3d2a; stroke: #3fb950; }
      .text { fill: #e6edf3; font-family: sans-serif; font-size: 12px; }
      .title { fill: #58a6ff; font-size: 14px; font-weight: bold; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-danger { stroke: #f85149; }
      .arrow-success { stroke: #3fb950; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="25" class="title" text-anchor="middle">SWC-106: Unprotected SELFDESTRUCT  Attack vs Fix</text>
  
  <!-- VULNERABLE SIDE -->
  <rect x="30" y="50" width="300" height="180" class="box vuln" rx="8"/>
  <text x="180" y="75" class="title" text-anchor="middle">Vulnerable (SWC-106)</text>
  
  <rect x="50" y="95" width="120" height="35" class="box" rx="4"/>
  <text x="110" y="117" class="text" text-anchor="middle">User</text>
  
  <rect x="50" y="150" width="260" height="50" class="box" rx="4"/>
  <text x="180" y="175" class="text" text-anchor="middle">Contract (holds ETH)</text>
  
  <rect x="50" y="215" width="120" height="35" class="box" rx="4"/>
  <text x="110" y="237" class="text" text-anchor="middle">Attacker</text>
  
  <path d="M 110 130 L 110 150" class="arrow"/>
  <text x="130" y="142" class="text" font-size="10">deposit</text>
  
  <path d="M 110 250 L 110 200 L 180 200" class="arrow arrow-danger"/>
  <text x="120" y="225" class="text" font-size="10" fill="#f85149">destroy()</text>
  <text x="185" y="195" class="text" font-size="9" fill="#f85149">NO CHECK!</text>
  
  <text x="180" y="275" class="text" text-anchor="middle" fill="#f85149">’ All ETH stolen by attacker</text>
  
  <!-- FIXED SIDE -->
  <rect x="370" y="50" width="300" height="180" class="box secure" rx="8"/>
  <text x="520" y="75" class="title" text-anchor="middle">Fixed (Remediated)</text>
  
  <rect x="390" y="95" width="120" height="35" class="box" rx="4"/>
  <text x="450" y="117" class="text" text-anchor="middle">Owner</text>
  
  <rect x="390" y="150" width="260" height="50" class="box" rx="4"/>
  <text x="520" y="175" class="text" text-anchor="middle">Contract (holds ETH)</text>
  
  <rect x="390" y="215" width="120" height="35" class="box" rx="4"/>
  <text x="450" y="237" class="text" text-anchor="middle">Attacker</text>
  
  <path d="M 450 130 L 450 150" class="arrow"/>
  <text x="470" y="142" class="text" font-size="10">deposit</text>
  
  <path d="M 450 250 L 450 200 L 520 200" class="arrow arrow-success"/>
  <text x="460" y="225" class="text" font-size="10" fill="#3fb950">destroy()</text>
  <text x="525" y="195" class="text" font-size="9" fill="#3fb950">onlyOwner </text>
  
  <path d="M 450 250 L 450 200 L 390 200" class="arrow arrow-danger"/>
  <text x="380" y="195" class="text" font-size="9" fill="#f85149">REVERT </text>
  
  <text x="520" y="275" class="text" text-anchor="middle" fill="#3fb950">’ Only owner can destroy</text>
  
  <!-- SELFDESTRUCT behavior -->
  <rect x="30" y="300" width="640" height="130" class="box" rx="8"/>
  <text x="350" y="325" class="title" text-anchor="middle">selfdestruct(address) Behavior</text>
  <text x="50" y="355" class="text">1. Sends ALL remaining ETH to the specified address</text>
  <text x="50" y="375" class="text">2. Permanently destroys the contract (storage cleared)</text>
  <text x="50" y="395" class="text">3. Contract address becomes invalid  future calls revert</text>
  <text x="50" y="415" class="text">4. IRREVERSIBLE  cannot be undone</text>
</svg>
